<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidewall captured</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#12357A}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#0A0A0A;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="flex-grow:1;display:flex;align-items:center;justify-content:center;padding-top:32px">
    <svg width="210" height="210" viewBox="0 0 320 320" fill="none" aria-hidden="true">
      <circle cx="160" cy="160" r="122" stroke="#2B2F36" stroke-width="46"></circle>
      <circle cx="160" cy="160" r="146" stroke="#4DA3FF" stroke-width="5"></circle>
      <circle cx="160" cy="160" r="78" stroke="#3A3F47" stroke-width="7"></circle>
      <path d="M160 82V238M82 160H238M105 105L215 215M215 105L105 215" stroke="#3A3F47" stroke-width="8"></path>
      <circle cx="160" cy="160" r="36" fill="#12357A" stroke="#4DA3FF" stroke-width="4"></circle>
      <path d="M144 160l11 11 21-22" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>
  <div style="background:#FFFFFF;color:#0A0A0A;border-radius:24px 24px 0 0;padding:22px 20px 32px">
    <h1 style="margin:0;font-size:22px;line-height:28px;font-weight:700">Sidewall captured</h1>
    <p style="margin:4px 0 12px;font-size:14px;line-height:20px;color:#5A606B">Check the details and correct anything that's wrong.</p>
    <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
      <div style="display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;min-height:50px;border-top:1px solid #E3E6EB">
        <label for="{{f.id}}" style="font-size:14px;color:#5A606B">{{f.label}}</label>
        <input id="{{f.id}}" value="{{f.value}}" onChange="{{f.change}}" style="width:100%;height:44px;box-sizing:border-box;border:0;padding:0;text-align:right;background:transparent;color:#0A0A0A;font:600 15px Inter,system-ui,sans-serif">
      </div>
    </sc-for>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:12px">
      <a href="Tread.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:12px;background:#12357A;color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:600">Scan tread</a>
      <a href="Sidewall.dc.html" style="display:flex;align-items:center;justify-content:center;height:44px;font-size:15px;font-weight:500;text-decoration:none">Scan sidewall again</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const rows = [
      ['size', 'Tyre size', '215/65 R15'],
      ['dot', 'DOT/TIN', '4B7K 2JX 2623'],
      ['make', 'Make', 'Bridgestone'],
      ['model', 'Model', 'Ecopia EP150']
    ];
    return {
      fields: rows.map(([id, label, value]) => ({
        id,
        label,
        value: s[id] ?? value,
        change: (e) => this.setState({ [id]: e.target.value })
      }))
    };
  }
}
</script>
</body>
</html>
