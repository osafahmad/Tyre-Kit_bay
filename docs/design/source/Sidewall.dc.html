<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidewall capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#FFFFFF}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#0A0A0A;color:#FFFFFF;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:56px 12px 8px">
    <a href="TyreSetup.dc.html" aria-label="Back" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size:13px;color:#C7CCD4">Tyre 1 of 4</span>
    <span style="width:44px"></span>
  </div>
  <div style="padding:4px 24px 16px;text-align:center">
    <h1 style="margin:0;font-size:24px;line-height:30px;font-weight:700">Left front tyre</h1>
    <p style="margin:4px 0 0;font-size:14px;color:#C7CCD4">Step 1 of 2: sidewall</p>
  </div>
  <div style="position:relative;flex-grow:1;margin:0 16px;border-radius:20px;background:#17191E;overflow:hidden;display:flex;align-items:center;justify-content:center">
    <span style="position:absolute;top:16px;left:50%;margin-left:-58px;width:116px;text-align:center;box-sizing:border-box;background:#12357A;color:#FFFFFF;border:1px solid #4DA3FF;border-radius:999px;padding:7px 0;font-size:13px;font-weight:600">Focusing…</span>
    <svg width="320" height="320" viewBox="0 0 320 320" fill="none" aria-hidden="true">
      <circle cx="160" cy="160" r="122" stroke="#2B2F36" stroke-width="46"></circle>
      <circle cx="160" cy="160" r="146" stroke="#4DA3FF" stroke-width="4"></circle>
      <circle cx="160" cy="160" r="122" stroke="#596170" stroke-width="2" stroke-dasharray="18 9"></circle>
      <circle cx="160" cy="160" r="96" stroke="#4DA3FF" stroke-width="2"></circle>
      <circle cx="160" cy="160" r="78" stroke="#3A3F47" stroke-width="7"></circle>
      <path d="M160 82V238M82 160H238M105 105L215 215M215 105L105 215" stroke="#3A3F47" stroke-width="8"></path>
      <circle cx="160" cy="160" r="22" fill="#0A0A0A" stroke="#596170" stroke-width="3"></circle>
      <circle cx="160" cy="160" r="5" fill="#FFFFFF"></circle>
    </svg>
    <span style="position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:14px">Fit the whole tyre inside the circle</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;padding:20px 24px 36px">
    <button type="button" onClick="{{toggleFlash}}" aria-pressed="{{flashOn}}" style="justify-self:start;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:52px;justify-content:center;background:transparent;border:0;color:#FFFFFF;font:500 12px Inter,system-ui,sans-serif">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4DA3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg>{{flashLabel}}
    </button>
    <a href="SidewallDone.dc.html" aria-label="Capture sidewall" style="justify-self:center;display:flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:50%;border:4px solid #4DA3FF;box-sizing:border-box;text-decoration:none">
      <span style="display:block;width:56px;height:56px;border-radius:50%;background:#FFFFFF"></span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const flashOn = !!(this.state && this.state.flashOn);
    return {
      flashOn: flashOn ? 'true' : 'false',
      flashLabel: flashOn ? 'Flash on' : 'Flash off',
      toggleFlash: () => this.setState({ flashOn: !flashOn })
    };
  }
}
</script>
</body>
</html>
