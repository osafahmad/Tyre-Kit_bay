<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tread capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#FFFFFF}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#0A0A0A;color:#FFFFFF;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:56px 12px 8px">
    <a href="SidewallDone.dc.html" aria-label="Back" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size:13px;color:#C7CCD4">Tyre 1 of 4</span>
    <span style="width:44px"></span>
  </div>
  <div style="padding:4px 24px 16px;text-align:center">
    <h1 style="margin:0;font-size:24px;line-height:30px;font-weight:700">Left front tyre</h1>
    <p style="margin:4px 0 0;font-size:14px;color:#C7CCD4">Step 2 of 2: tread</p>
  </div>
  <div style="position:relative;flex-grow:1;margin:0 16px;border-radius:20px;background:#17191E;overflow:hidden">
    <svg width="358" height="470" viewBox="0 0 358 470" fill="none" aria-hidden="true" style="position:absolute;left:0;top:0">
      <path d="M0 40h358M0 150h358M0 320h358M0 430h358" stroke="#2B2F36" stroke-width="12"></path>
      <path d="M0 94l40-54 40 54 40-54 40 54 40-54 40 54 40-54 40 54 40-54M0 205l40-55 40 55 40-55 40 55 40-55 40 55 40-55 40 55 40-55M0 375l40-55 40 55 40-55 40 55 40-55 40 55 40-55 40 55 40-55" stroke="#30343B" stroke-width="5"></path>
    </svg>
    <div style="position:absolute;left:0;right:0;top:16px;display:flex;justify-content:center">
      <span style="display:flex;align-items:center;gap:6px;background:#12357A;border:1px solid #4DA3FF;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Distance OK
      </span>
    </div>
    <div style="position:absolute;left:16px;right:16px;top:50%;margin-top:-70px;height:140px;border:3px solid #4DA3FF;border-radius:14px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:2px;background:#0A0A0A">
      <svg width="240" height="60" viewBox="0 0 240 60" fill="none" stroke="#4DA3FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 8l24 22-24 22M70 8l24 22-24 22M120 8l24 22-24 22M170 8l24 22-24 22"></path></svg>
    </div>
    <span style="position:absolute;left:24px;right:24px;bottom:18px;text-align:center;font-size:14px;line-height:20px">Move slowly across the tread, from edge to edge</span>
  </div>
  <div style="padding:18px 24px 28px">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px"><span>Capturing frames</span><span style="font-weight:600">65%</span></div>
    <div role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100" aria-label="Capture progress" style="height:8px;background:#2B2F36;border-radius:999px;overflow:hidden"><div style="width:65%;height:8px;background:#4DA3FF"></div></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px">
      <a href="TreadRetry.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;border:1px solid #596170;font-size:15px;font-weight:600;text-decoration:none">Having trouble</a>
      <a href="TreadDone.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#12357A;border:1px solid #4DA3FF;font-size:15px;font-weight:600;text-decoration:none">Finish sweep</a>
    </div>
  </div>
</div>
</x-dc>
