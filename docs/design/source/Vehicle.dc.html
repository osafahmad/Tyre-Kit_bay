<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vehicle details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#12357A}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#FFFFFF;color:#0A0A0A;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="background:#0A0A0A;color:#FFFFFF;padding:56px 12px 20px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <a href="ChassisScan.dc.html" aria-label="Back" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:#FFFFFF">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <span style="font-size:13px;color:#C7CCD4;padding-right:12px">Step 2 of 3</span>
    </div>
    <h1 style="margin:8px 12px 0;font-size:26px;line-height:32px;font-weight:700">Check vehicle details</h1>
  </div>
  <div style="flex-grow:1;padding:24px 20px;display:flex;flex-direction:column;gap:24px">
    <div>
      <label for="plate" style="display:block;margin-bottom:8px;font-size:14px;font-weight:600">Number plate <span style="font-weight:400;color:#5A606B">(optional)</span></label>
      <input id="plate" value="{{plate}}" onChange="{{setPlate}}" placeholder="ABC-1234" style="width:100%;height:52px;box-sizing:border-box;padding:0 14px;border:1px solid #AEB4BE;border-radius:12px;font:600 18px Inter,system-ui,sans-serif;color:#0A0A0A;background:#FFFFFF">
      <a href="PlateScan.dc.html" style="display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;text-decoration:none">Scan plate again</a>
    </div>
    <div>
      <label for="chassis" style="display:block;margin-bottom:8px;font-size:14px;font-weight:600">Chassis number <span style="font-weight:400;color:#5A606B">(optional)</span></label>
      <input id="chassis" value="{{chassis}}" onChange="{{setChassis}}" placeholder="JT2BG22K0W0123456" style="width:100%;height:52px;box-sizing:border-box;padding:0 14px;border:1px solid #AEB4BE;border-radius:12px;font:600 16px ui-monospace,Menlo,Consolas,monospace;color:#0A0A0A;background:#FFFFFF">
      <p style="margin:8px 0 0;font-size:13px;line-height:19px;color:#5A606B">Some vehicles have fewer than 17 characters.</p>
      <a href="ChassisScan.dc.html" style="display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;text-decoration:none">Scan chassis number again</a>
    </div>
  </div>
  <div style="padding:12px 20px 36px">
    <a href="TyreSetup.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:12px;background:#12357A;color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:600">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    return {
      plate: s.plate ?? 'ABC-1234',
      chassis: s.chassis ?? 'JT2BG22K0W0123456',
      setPlate: (e) => this.setState({ plate: e.target.value.toUpperCase() }),
      setChassis: (e) => this.setState({ chassis: e.target.value.toUpperCase() })
    };
  }
}
</script>
</body>
</html>
