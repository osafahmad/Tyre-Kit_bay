<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan number plate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#FFFFFF}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#0A0A0A;color:#FFFFFF;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:56px 12px 8px">
    <a href="Home.dc.html" aria-label="Back" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size:13px;color:#C7CCD4">Step 1 of 3</span>
    <a href="ChassisScan.dc.html" style="display:flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 8px;font-size:15px;font-weight:600;text-decoration:none">Skip</a>
  </div>
  <div style="padding:4px 24px 16px;text-align:center">
    <h1 style="margin:0;font-size:24px;line-height:30px;font-weight:700">Scan number plate</h1>
    <p style="margin:4px 0 0;font-size:14px;color:#C7CCD4">Optional</p>
  </div>
  <div style="position:relative;flex-grow:1;margin:0 16px;border-radius:20px;background:#17191E;overflow:hidden;display:flex;align-items:center;justify-content:center">
    <svg width="340" height="340" viewBox="0 0 340 340" fill="none" aria-hidden="true">
      <path d="M60 170l28-72c6-14 18-22 34-22h96c16 0 28 8 34 22l28 72c16 6 24 18 24 34v60c0 8-6 14-14 14H50c-8 0-14-6-14-14v-60c0-16 8-28 24-34z" fill="#2B2F36"></path>
      <path d="M86 166l20-54c4-10 12-16 22-16h84c10 0 18 6 22 16l20 54z" fill="#111317"></path>
      <path d="M50 196h52l14 18H50zM290 196h-52l-14 18h74z" fill="#596170"></path>
    </svg>
    <div style="position:absolute;left:50%;top:50%;margin-left:-130px;margin-top:28px;width:260px;height:86px;box-sizing:border-box;border:3px solid #4DA3FF;border-radius:10px;display:flex;align-items:center;justify-content:center">
      <span style="display:block;background:#FFFFFF;color:#0A0A0A;border-radius:5px;padding:7px 18px;font-size:24px;font-weight:700">ABC-1234</span>
    </div>
    <span style="position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:14px;color:#FFFFFF">Place the whole plate inside the box</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;padding:20px 24px 36px">
    <button type="button" onClick="{{toggleFlash}}" aria-pressed="{{flashOn}}" style="justify-self:start;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:52px;justify-content:center;background:transparent;border:0;color:#FFFFFF;font:500 12px Inter,system-ui,sans-serif">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4DA3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg>{{flashLabel}}
    </button>
    <a href="PlateConfirm.dc.html" aria-label="Capture plate" style="justify-self:center;display:flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:50%;border:4px solid #4DA3FF;box-sizing:border-box;text-decoration:none">
      <span style="display:block;width:56px;height:56px;border-radius:50%;background:#FFFFFF"></span>
    </a>
    <a href="Vehicle.dc.html" style="justify-self:end;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:52px;justify-content:center;font-size:12px;font-weight:500;text-decoration:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4DA3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M8 14h8"></path></svg>Type it
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const flashOn = !!(this.state && this.state.flashOn);
    return {
      flashOn: flashOn ? 'true' : 'false',
      flashLabel: flashOn ? 'Flash on' : 'Flash off',
      toggleFlash: () => this.setState({ flashOn: !flashOn })
    };
  }
}
</script>
</body>
</html>
